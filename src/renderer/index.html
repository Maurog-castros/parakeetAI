<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  :root { --bg: rgba(18,20,26,0.86); --fg:#e7eaf0; --mut:#8b93a7; --acc:#6ea8fe; --card:rgba(32,36,46,0.9); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: Segoe UI, system-ui, sans-serif; color:var(--fg); }
  body { background: transparent; }
  #app { height:100vh; display:flex; flex-direction:column; background:var(--bg);
         border:1px solid rgba(255,255,255,0.08); border-radius:12px; overflow:hidden; backdrop-filter: blur(6px); }
  header { -webkit-app-region: drag; display:flex; align-items:center; gap:8px; padding:8px 10px;
           background:rgba(0,0,0,0.25); font-size:12px; color:var(--mut); }
  header .title { font-weight:600; color:var(--fg); }
  header .spacer { flex:1; }
  header button { -webkit-app-region: no-drag; }
  button { background:var(--card); color:var(--fg); border:1px solid rgba(255,255,255,0.1);
           border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; }
  button:hover { border-color: var(--acc); }
  button.primary { background:var(--acc); color:#0b1020; border-color:var(--acc); font-weight:600; }
  #status { padding:4px 10px; font-size:11px; color:var(--mut); border-bottom:1px solid rgba(255,255,255,0.06); }
  #status.err { color:#ff8b8b; }
  main { flex:1; display:flex; flex-direction:column; gap:8px; padding:10px; overflow:hidden; }
  .panel { background:var(--card); border:1px solid rgba(255,255,255,0.07); border-radius:9px; padding:8px 10px; overflow:auto; }
  .panel h2 { margin:0 0 4px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  #transcript { flex:0 1 20%; min-height:90px; font-size:12px; line-height:1.4; color:#c6ccda; white-space:pre-wrap; }
  #answer { flex:1; font-size:14px; line-height:1.5; white-space:pre-wrap; }
  footer { display:flex; gap:8px; padding:8px 10px; border-top:1px solid rgba(255,255,255,0.06); }

  #ctxPanel { position:absolute; inset:0; background:rgba(8,9,12,0.92); align-items:stretch; padding:10px; }
  #ctxPanel[hidden] { display:none; }
  #ctxPanel:not([hidden]) { display:flex; }
  .ctx-card { display:flex; flex-direction:column; gap:6px; width:100%; overflow:auto; }
  .ctx-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .ctx-row { display:flex; align-items:center; gap:8px; }
  #ctxPanel label { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  #ctxPanel textarea { flex:1; min-height:60px; resize:none; background:var(--card); color:var(--fg);
    border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:8px; font-size:12px; line-height:1.4; font-family:inherit; }
  #ctxPanel #jd { flex:0 0 28%; }
  #ctxPanel #cv { flex:1; }
  #ctxPanel input[type="number"] { width:90px; background:var(--card); color:var(--fg); border:1px solid rgba(255,255,255,0.1);
    border-radius:7px; padding:6px 8px; font:inherit; }
  #responseCharsHint { font-size:11px; color:var(--mut); }
  .format-options { margin:0; padding:6px 8px; border:1px solid rgba(255,255,255,0.1); border-radius:8px; }
  .format-options legend { padding:0 4px; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .format-options label { display:inline-flex; align-items:center; gap:5px; margin-right:14px; cursor:pointer; text-transform:none; letter-spacing:0; color:var(--fg); }
  .format-options input { accent-color:var(--acc); }
  .share-option { min-height:48px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size:12px !important; letter-spacing:0 !important; text-transform:none !important; color:var(--fg) !important; }
  .share-option input { width:18px; height:18px; margin:0; accent-color:var(--acc); cursor:pointer; }
  .share-option-text { display:flex; flex-direction:column; gap:2px; }
  .share-option-text small { color:var(--mut); font-size:11px; }
  #responseInstructions { flex:0 0 58px; min-height:58px; resize:vertical; }
  :where(button, input, textarea):focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button.small { padding:3px 8px; font-size:11px; }
  .ctx-foot { display:flex; align-items:center; gap:8px; }
  .ctx-foot .spacer { flex:1; }
  #ctxInfo { font-size:11px; color:var(--mut); }
</style>
</head>
<body>
  <div id="app">
    <header>
      <span class="title">▸ Assistant</span>
      <span class="spacer"></span>
      <button id="settings">⚙ Configuración</button>
      <button id="clickthru">Click-through: off</button>
      <button id="close">✕</button>
    </header>
    <div id="status">init…</div>
    <main>
      <div class="panel" id="answer"><h2>Sugerencia</h2><div id="ans">—</div></div>
      <div class="panel" id="transcript"><h2>Escuchando</h2><div id="tx"></div></div>
    </main>
    <footer>
      <button id="toggle" class="primary">▶ Start</button>
      <button id="clear">Clear</button>
    </footer>

    <div id="ctxPanel" hidden>
      <div class="ctx-card">
        <div class="ctx-head">
          <strong>Configuración de la entrevista</strong>
          <button id="ctxClose">✕</button>
        </div>
        <label>Descripción del cargo</label>
        <textarea id="jd" placeholder="Pega aquí las funciones y requisitos del puesto…"></textarea>
        <div class="ctx-row">
          <label>CV del candidato</label>
          <button id="cvFileBtn" class="small">Cargar archivo (.txt/.md/.pdf)</button>
          <input id="cvFile" type="file" accept=".txt,.md,.pdf" hidden />
        </div>
        <textarea id="cv" placeholder="Pega tu CV, o cárgalo desde archivo…"></textarea>
        <div class="ctx-row">
          <label for="responseChars">Máximo de caracteres</label>
          <input id="responseChars" name="responseChars" type="number" min="120" max="1500" step="20"
            value="500" aria-describedby="responseCharsHint" />
          <span id="responseCharsHint">120–1500; incluye espacios.</span>
        </div>
        <fieldset class="format-options">
          <legend>Formato de respuesta</legend>
          <label for="formatBullets">
            <input id="formatBullets" name="responseFormat" type="radio" value="bullets" checked />
            Lista de bullets
          </label>
          <label for="formatParagraph">
            <input id="formatParagraph" name="responseFormat" type="radio" value="paragraph" />
            Texto continuo
          </label>
        </fieldset>
        <label for="responseInstructions">Instrucciones adicionales para el LLM</label>
        <textarea id="responseInstructions" maxlength="1000"
          placeholder="Ej.: responde con lenguaje simple, incluye un ejemplo concreto y evita tecnicismos."
          aria-describedby="responseInstructionsHint"></textarea>
        <span id="responseInstructionsHint">Opcional. Máximo 1000 caracteres; no reemplaza el CV ni la descripción del cargo.</span>
        <label class="share-option" for="shareInterfaceVisible">
          <input id="shareInterfaceVisible" name="shareInterfaceVisible" type="checkbox" />
          <span class="share-option-text">
            Mostrar la interfaz al compartir pantalla
            <small>Desactivado: el overlay queda oculto para los espectadores.</small>
          </span>
        </label>
        <div class="ctx-foot">
          <span id="ctxInfo"></span>
          <span class="spacer"></span>
          <button id="ctxSave" class="primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="deepgram.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
